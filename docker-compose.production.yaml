version: '3'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env.production ## Domain environment variables
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '0.0.0.0:3000:3000'  # 对外暴露，便于调试
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=421124

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass 421124"]
    env_file: .env.service.sjlpj.cn
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginxPro.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/letsencryptPro:/etc/letsencrypt:ro  # SSL 证书目录
      - nginx_logs:/var/log/nginx
    depends_on:
      - rails
    command: nginx -g 'daemon off;'

  # backup:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.backup
  #   restart: unless-stopped
  #   env_file: .env.production
  #   depends_on:
  #     - postgres
  #     - redis
  #   volumes:
  #     - backup_logs:/app/logs
  #     - ./scripts/backup/backup-to-s3.sh:/app/scripts/backup-to-s3.sh:ro
  #   environment:
  #     - DB_HOST=postgres
  #     - DB_PORT=5432
  #     - DB_NAME=chatwoot
  #     - DB_USER=postgres
  #     - DB_PASSWORD=421124
  #     # 将 .env.production 中的 S3 配置映射为备份脚本期望的变量名
  #     - S3_BUCKET=${S3_BACKUP_BUCKET}
  #     - S3_PREFIX=${S3_BACKUP_PREFIX}
  #   networks:
  #     - default
  #   command: cron

volumes:
  storage_data:
  postgres_data:
  redis_data:
  nginx_logs:
  # backup_logs: